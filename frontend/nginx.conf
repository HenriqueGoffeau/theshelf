# The frontend container's own nginx. Two jobs:
#   1) serve the built Vite SPA (static files)
#   2) forward /api/* to the backend container (same-origin, so cookies work)
# The homelab reverse proxy (homelab-nginx) sends the whole site here as one unit.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls -> backend node server on the private homelab network.
    # proxy_pass has no trailing path, so the full "/api/..." URI is preserved.
    location /api/ {
        proxy_pass http://theshelf-backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA routing: anything that isn't a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
